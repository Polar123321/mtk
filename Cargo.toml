[package]
name = "mtk"
version = "0.1.0"
edition = "2021"
description = "Universal token saver for AI coding agents: compresses the output of every tool (shell, MCP, grep) before it reaches the model."
license = "MIT"
repository = "https://github.com/Polar123321/mtk"
readme = "README.md"
keywords = ["llm", "tokens", "claude-code", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
