<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-labelledby="t d">
  <title id="t">How MTK sits between tools and the model</title>
  <desc id="d">A tool result enters the MTK pipeline (normalize, json, roblox, log, budget) and a much smaller result reaches the model. The original is stored for lossless recall.</desc>
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b98a9"/>
    </marker>
  </defs>
  <rect width="1100" height="330" rx="20" fill="#0d1526"/>
  <rect x="0.5" y="0.5" width="1099" height="329" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g font-family="'Segoe UI','SF Pro Display',Inter,Arial,sans-serif">
    <!-- tool output -->
    <rect x="40" y="70" width="230" height="130" rx="16" fill="#1a2440" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="64" y="106" font-size="15" fill="#8b98a9" letter-spacing="1.5">TOOL OUTPUT</text>
    <text x="64" y="150" font-size="40" font-weight="800" fill="#f0883e">10,765</text>
    <text x="64" y="176" font-size="15" fill="#c9d1d9">tokens · Roblox tree</text>

    <!-- pipeline -->
    <rect x="365" y="40" width="370" height="190" rx="18" fill="#10261f" stroke="#2dd4bf" stroke-opacity="0.55"/>
    <text x="392" y="76" font-size="15" fill="#2dd4bf" letter-spacing="1.5">MTK PIPELINE</text>
    <g font-family="'Cascadia Code',Consolas,Menlo,monospace" font-size="16">
      <text x="392" y="112" fill="#7ee787">normalize</text><text x="500" y="112" fill="#e6edf3">ANSI · progress · blanks</text>
      <text x="392" y="138" fill="#7ee787">json</text><text x="500" y="138" fill="#e6edf3">tables · prune · hoist</text>
      <text x="392" y="164" fill="#7ee787">roblox</text><text x="500" y="164" fill="#e6edf3">tree · inspect</text>
      <text x="392" y="190" fill="#7ee787">log</text><text x="500" y="190" fill="#e6edf3">runs · repeats · ×N</text>
      <text x="392" y="216" fill="#7ee787">budget</text><text x="500" y="216" fill="#e6edf3">head + tail + errors</text>
    </g>

    <!-- model -->
    <rect x="830" y="70" width="230" height="130" rx="16" fill="#1a2440" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="854" y="106" font-size="15" fill="#8b98a9" letter-spacing="1.5">WHAT THE MODEL READS</text>
    <text x="854" y="150" font-size="40" font-weight="800" fill="url(#ink)">903</text>
    <text x="854" y="176" font-size="15" fill="#c9d1d9">tokens · same information</text>

    <!-- arrows -->
    <line x1="272" y1="135" x2="360" y2="135" stroke="#8b98a9" stroke-width="2.5" marker-end="url(#arrow)"/>
    <line x1="738" y1="135" x2="826" y2="135" stroke="#8b98a9" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- recall -->
    <path d="M550 232 V262 H150" fill="none" stroke="#8b98a9" stroke-width="2" stroke-dasharray="6 6"/>
    <rect x="40" y="248" width="300" height="52" rx="14" fill="#1a2440" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="62" y="272" font-size="15" font-weight="700" fill="#e6edf3">Lossless recall store</text>
    <text x="62" y="291" font-size="13" fill="#8b98a9" font-family="'Cascadia Code',Consolas,Menlo,monospace">mtk recall &lt;id&gt; --grep RE</text>
    <text x="380" y="292" font-size="14" fill="#8b98a9">the original is always kept on disk</text>
  </g>
</svg>
